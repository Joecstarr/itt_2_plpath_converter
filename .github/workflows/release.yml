name: Create release

on:
    pull_request:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:
        inputs:
            branch:
                description: "Branch to release"
                required: true
                type: choice
                default: main
                options:
                    - main
                    # You can add more options here if you need to test on different SDK versions
            do_release:
                description: 'Create Release (must also select Tag above!")'
                required: true
                default: false
                type: boolean

permissions:
    pages: write
    id-token: write
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Check Nixpkgs inputs
              uses: DeterminateSystems/flake-checker-action@main
              with:
                  fail-mode: true

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@main

            - name: Build
              run: |
                  nix develop --command \
                    just build_all

            - name: Check
              run: |
                  nix develop --command \
                    just check

            - name: Test
              run: |
                  nix develop --command \
                    just test_all

            - name: Docs html
              run: |
                  nix develop --command \
                    just html

            - name: Upload artifact
              if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./.build/docs

            - name: Deploy to GitHub Pages
              if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
              uses: actions/deploy-pages@v4

            - name: Release
              if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  make_latest: true
                  files: |
                      .build/Release/itt2plp

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0 # GitHub Actions example:

            - name: Install uv
              shell: cmd
              run: pip install uv

            - name: Install python requirements
              run: |
                  uv sync
                  uv pip install lizard

            - name: Build cmake
              shell: cmd
              run: .venv\Scripts\Activate.bat && cmake -B.\.build\Release -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_COLOR_DIAGNOSTICS=TRUE -G Ninja -DPytest_ROOT=.\.venv\share\Pytest\cmake

            - name: Build source
              shell: cmd
              run: .venv\Scripts\Activate.bat && cmake --build .\.build\Release -j

            - name: Test
              shell: cmd
              run: .venv\Scripts\Activate.bat && cd .build\Release && ctest

            - name: Release
              if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      .build/Release/itt2plp.exe
