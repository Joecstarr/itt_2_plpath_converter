repos:
    - repo: local
      hooks:
          - id: ruff_check
            name: ruff check
            language: system
            entry: ruff check
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "source/**/*.py"
          - id: ruff_format
            name: ruff format
            language: system
            entry: ruff format --check
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "source/**/*.py"
          - id: tombi
            name: tombi
            language: system
            entry: tombi format --check
            exclude:
                glob:
                    - ".github/**/*.*"
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.toml"
          - id: docs
            name: docs
            language: system
            entry: rumdl check
            exclude:
                glob:
                    - ".github/**/*.*"
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.md"
          - id: valgrind
            name: valgrind
            language: system
            entry: just check-valgrind
            pass_filenames: false
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.c"
                    - "**/*.h"
                    - "**/*.hpp"
                    - "**/*.cpp"
          - id: uncrustify
            name: uncrustify
            language: system
            entry: uncrustify -c .uncrustify.cfg --check
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.c"
                    - "**/*.h"
                    - "**/*.hpp"
                    - "**/*.cpp"
          - id: cmake-format
            name: cmake-format
            language: system
            entry: cmake-format --check
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/CMakeLists.txt"
                    - "libraries/CMakeLists.txt"
          - id: doxygen
            name: doxygen
            language: system
            entry: just check-doxygen
            pass_filenames: false
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.c"
                    - "**/*.h"
                    - "**/*.cpp"
                    - "**/*.hpp"
          - id: check-cppcheck
            name: cppcheck
            language: system
            entry: just check-cppcheck
            pass_filenames: false
            exclude:
                glob:
                    - "libraries/**/*.*"
            files:
                glob:
                    - "**/*.c"
                    - "**/*.h"
                    - "**/*.cpp"
                    - "**/*.hpp"
